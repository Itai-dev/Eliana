<style>
  :root { --ink:#091e5c; --blue:#1450dc; --sky:#64b9e1; --paper:#eff4f9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: var(--ink); color: #fff; font-family: "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(700px 500px at 85% 0%, rgba(100,185,225,.25), transparent 60%), radial-gradient(600px 500px at 0% 100%, rgba(20,80,220,.4), transparent 60%);
    -webkit-user-select: none; user-select: none; }
  .who { text-align: center; }
  .who h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
  .who h1 span { color: var(--sky); }
  .who p { margin: 6px 0 0; color: #b3c4e3; font-size: 15px; font-weight: 500; }
  .card { width: min(86vw, 400px); background: #fff; border-radius: 32px; padding: 26px 26px 20px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); text-align: center; }
  .qr-wrap { position: relative; width: 100%; aspect-ratio: 1; }
  .qr-svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .badge { position: absolute; top: 50%; left: 50%; width: 21%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: var(--ink); border: 5px solid #fff; display: grid; place-items: center; color: var(--sky); font-weight: 700; font-size: clamp(14px, 4.4vw, 20px); letter-spacing: -1px; }
  .url { margin: 18px 0 0; font-size: clamp(22px, 6.4vw, 28px); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; direction: ltr; }
  .hint { margin: 0; color: #b3c4e3; font-size: 15px; text-align: center; }
  .actions { display: flex; gap: 10px; width: min(86vw, 400px); }
  .actions a, .actions button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 999px; font: 600 16px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
  .primary { background: #fff; color: var(--ink); border: 0; }
  .ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.35); }
  .install { display: none; width: min(86vw, 400px); margin: 0; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,.08); color: #dbe6f5; font-size: 14px; line-height: 1.45; text-align: center; }
  .install.show { display: block; }
  .en { display: block; color: #8fa3c8; font-size: 13px; margin-top: 2px; direction: ltr; }
  .toast { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Intro: card comes in showing a Star of David, which spins down into the badge while the QR ripples out. */
  .star { display: none; position: absolute; inset: 12%; width: 76%; height: 76%; overflow: visible; }
  .star path { fill: none; stroke: var(--ink); stroke-width: 5.5; stroke-linejoin: round; }
  .mods rect { fill: var(--ink); }
  html.intro .star { display: block; animation: spin 1s 1.05s both cubic-bezier(.65,0,.35,1); }
  html.intro .star path { stroke-dasharray: 1; animation: draw .75s .35s both cubic-bezier(.4,0,.2,1); }
  html.intro .qr-svg > path { opacity: 0; }
  html.intro.done .qr-svg > path { opacity: 1; }
  html.intro .mods rect { transform-box: fill-box; transform-origin: center; animation: pop .45s both cubic-bezier(.3,1.6,.5,1); animation-delay: calc(1450ms + var(--d) * 22ms); }
  html.intro .who { animation: up .6s both cubic-bezier(.2,.8,.2,1); }
  html.intro .card { animation: cardIn .8s .15s both cubic-bezier(.2,.9,.25,1); }
  html.intro .badge { animation: badgeIn .5s 1.8s both cubic-bezier(.3,1.5,.5,1); }
  html.intro .url { animation: up .5s 2.15s both cubic-bezier(.2,.8,.2,1); }
  html.intro .hint, html.intro .actions, html.intro .install { animation: up .5s 2.3s both cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(60px) scale(.9); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes spin {
    0%   { transform: rotate(0) scale(1); opacity: 1; }
    75%  { opacity: 1; }
    100% { transform: rotate(360deg) scale(.26); opacity: 0; }
  }
  @keyframes pop { from { opacity: 0; transform: scale(0) rotate(90deg); } }
  @keyframes badgeIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(-90deg); } }
</style>
<script>
  try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro'); } catch (e) {}
</script>

<script>
  // Intro: split the QR path into single modules so they can pop in, rippling out from the center.
  function playIntro() {
    var root = document.documentElement;
    if (!root.classList.contains('intro')) return;
    var svg = document.querySelector('.qr-svg'), path = svg.querySelector('path');
    var d = path.getAttribute('d'), re = /([Mmh])\s*(-?[\d.]+)(?:\s+(-?[\d.]+))?/g, m, x = 0, y = 0, max = 0;
    var g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), html = '';
    while ((m = re.exec(d))) {
      var a = +m[2], b = +(m[3] || 0);
      if (m[1] === 'M') { x = a; y = b; }
      else if (m[1] === 'm') { x += a; y += b; }
      else {
        for (var i = 0; i < a; i++) {
          var cx = x + i, cy = y - 0.5, dist = Math.round(Math.hypot(cx - 16, cy - 16));
          if (dist > max) max = dist;
          html += '<rect x="' + cx + '" y="' + cy + '" width="1.04" height="1.04" style="--d:' + dist + '"/>';
        }
        x += a;
      }
    }
    g.setAttribute('class', 'mods'); g.setAttribute('transform', 'scale(10)'); g.innerHTML = html;
    svg.appendChild(g);
    setTimeout(function () { root.classList.add('done'); g.remove(); }, 1450 + max * 22 + 500);
  }
  playIntro();

  var LINK = 'https://elianasachs.com/links';
  document.getElementById('share').addEventListener('click', function () {
    if (navigator.share) { navigator.share({ title: 'Eliana Sachs · אליענה זקס', url: LINK }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(LINK) : Promise.reject()).then(function () {
      var t = document.getElementById('toast'); t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 1800);
    }).catch(function () { prompt('Link', LINK); });
  });
  var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !standalone) document.getElementById('install').classList.add('show');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/qr-sw.js', { scope: '/qr' }).catch(function () {});
  // keep the screen awake while showing the code, where supported
  if ('wakeLock' in navigator) { var lock = function () { navigator.wakeLock.request('screen').catch(function () {}); }; lock(); document.addEventListener('visibilitychange', function () { if (!document.hidden) lock(); }); }
</script>
